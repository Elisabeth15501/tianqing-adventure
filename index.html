<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天清往事 · 显德五年天清节</title>
<!-- 内联 favicon（2026-11-02）：此前没有 icon，浏览器自动请求 /favicon.ico 拿到 404，
     控制台每次都留一条红字，实机排障时容易误当成素材丢失。用一段 SVG data URI 顶掉。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235E8C8A'/%3E%3Cpath d='M16 6c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z' fill='%23EFF5F3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app" class="app"></div>
<script src="./js/data.js"></script>
<script src="./js/minigame.js"></script>
<script src="./js/frag.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/cloudsync.js"></script>
<script src="./js/assets.js"></script>
<script src="./js/portraits.js"></script>
<script src="./js/sfx.js"></script>
<!-- 版本标（唯一事实源）与设定页：设定页只读写设置，不参与游戏流程；
     放在 app.js 之前 —— app.js 一执行就要给顶栏挂「设定」入口。 -->
<script src="./js/version.js"></script>
<script src="./js/settings.js"></script>
<!-- 场景三层视差（S5 首用）：tilt.js 只做「姿态 → tx/ty」，scene-parallax.js 做「三层 + 探针」。
     两者都不自启，四幕脚本调用 SceneParallax.mount() 才生效；先加载 = 运行时可直接自检。 -->
<script src="./js/tilt.js"></script>
<script src="./js/scene-parallax.js"></script>
<script src="./js/scenes.js"></script>
<script src="./js/app.js"></script>
<!-- 瓷片查看器独立模块（2026-11-02 拆分）：放在 app.js 之后 ——
     app.js 一执行就开始画加载页，viewer.js 的解析不再挡在它前面；
     查看器只在点击时调用，那时早已解析完成。 -->
<script src="./js/viewer.js"></script>
</body>
</html>

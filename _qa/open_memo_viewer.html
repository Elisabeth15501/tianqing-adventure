(function(){
  var st=0;
  var iv=setInterval(function(){
    if(!window.TQApp){return;}
    if(st===0){ st=1; window.TQApp.memo(); return; }
    var cells=document.querySelectorAll('.memo-cell[role="button"]');
    if(cells.length && st===1){ st=2; cells[0].click(); setTimeout(function(){var cv=document.querySelector('.shv-stage canvas');var stg=document.querySelector('.shv-stage');var sh=document.querySelector('.shv-sheet');if(cv&&stg){document.body.setAttribute('data-cv','cw='+document.documentElement.clientWidth+' iw='+window.innerWidth+' sheet='+sh.offsetWidth+' stage='+stg.offsetWidth+'x'+stg.offsetHeight+' cv='+cv.width+'x'+cv.height+' css='+cv.offsetWidth);}},400); }
  },80);
})();
